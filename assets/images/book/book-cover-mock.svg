<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="400" height="600" role="img" aria-labelledby="t">
  <title id="t">Mockup ilustrativo da capa do livro — não é a capa oficial</title>
  <!--
    MOCKUP — CAPA ILUSTRATIVA (placeholder)
    Não representa a capa oficial. Substituir pela arte final quando existir.

    CONFIGURAÇÃO
    · Cores: variáveis CSS no bloco <style> abaixo.
    · Textos: elementos marcados com data-field="author|title-*|subtitle".
  -->
  <style>
    :root {
      --cover-a: #1c1814;   /* fundo da capa (topo) */
      --cover-b: #0e0c0a;   /* fundo da capa (base) */
      --gold: #c9a84c;      /* tipografia / ornamentos */
      --gold-soft: #8a7440; /* detalhes discretos */
    }
    .serif { font-family: 'Cormorant Garamond', Georgia, 'Times New Roman', serif; }
    .sans { font-family: 'DM Sans', 'Segoe UI', Arial, sans-serif; }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" style="stop-color: var(--cover-a)"/>
      <stop offset="1" style="stop-color: var(--cover-b)"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0.07"/>
      <stop offset="0.4" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="spine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#fff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Capa -->
  <rect width="400" height="600" rx="4" fill="url(#bg)"/>
  <rect width="400" height="600" rx="4" fill="url(#sheen)"/>
  <rect x="0" y="0" width="16" height="600" fill="url(#spine)"/>

  <!-- Moldura dourada -->
  <rect x="34" y="30" width="342" height="540" fill="none" style="stroke: var(--gold)" stroke-opacity="0.55" stroke-width="1"/>
  <rect x="40" y="36" width="330" height="528" fill="none" style="stroke: var(--gold)" stroke-opacity="0.25" stroke-width="0.6"/>

  <!-- Autora -->
  <text data-field="author" class="sans" x="205" y="92" text-anchor="middle" font-size="11" letter-spacing="3.2" style="fill: var(--gold)">NÁGILA BERNARDA ZORTÉA</text>

  <!-- Ornamento -->
  <g transform="translate(205 206)" style="stroke: var(--gold)" fill="none">
    <line x1="-58" y1="0" x2="-12" y2="0" stroke-width="0.8"/>
    <line x1="12" y1="0" x2="58" y2="0" stroke-width="0.8"/>
    <rect x="-5" y="-5" width="10" height="10" transform="rotate(45)" stroke-width="0.9"/>
  </g>

  <!-- Título (nome do livro a definir) -->
  <text data-field="title-1" class="serif" x="205" y="262" text-anchor="middle" font-size="27" font-style="italic" style="fill: var(--gold)"></text>
  <text data-field="title-2" class="serif" x="205" y="306" text-anchor="middle" font-size="31" letter-spacing="2.5" style="fill: var(--gold)">TÍTULO DO</text>
  <text data-field="title-3" class="serif" x="205" y="346" text-anchor="middle" font-size="31" letter-spacing="2.5" style="fill: var(--gold)">LIVRO</text>

  <line x1="185" y1="378" x2="225" y2="378" style="stroke: var(--gold)" stroke-opacity="0.6" stroke-width="0.8"/>

  <!-- Subtítulo (placeholder) -->
  <text data-field="subtitle" class="serif" x="205" y="408" text-anchor="middle" font-size="15" font-style="italic" style="fill: var(--gold-soft)">Subtítulo do livro</text>

  <!-- Monograma -->
  <g transform="translate(205 488)">
    <circle r="21" fill="none" style="stroke: var(--gold)" stroke-opacity="0.6" stroke-width="0.8"/>
    <text class="serif" y="6" text-anchor="middle" font-size="17" letter-spacing="1" style="fill: var(--gold)">NZ</text>
  </g>

  <!-- Marcação de mockup -->
  <text class="sans" x="205" y="548" text-anchor="middle" font-size="7.5" letter-spacing="2.2" style="fill: var(--gold-soft)">MOCKUP · CAPA ILUSTRATIVA</text>
</svg>
