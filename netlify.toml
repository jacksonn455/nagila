# Site estático publicado a partir da raiz do repositório + Netlify Functions.
# Os arquivos gerados (i18n, sitemap, favicon) já ficam versionados, então não há build.

[build]
  publish = "."
  functions = "functions"

[functions]
  node_bundler = "esbuild"

[build.environment]
  NODE_VERSION = "20"
  # Valores públicos: aparecem no próprio site (CEP e endereço da clínica, dados do livro)
  # ou são palavras comuns. Tokens e chaves continuam sendo verificados pelo secrets scanning.
  SECRETS_SCAN_OMIT_KEYS = "ORIGIN_CEP,NODE_ENV,BOOK_TITLE,BOOK_PRICE_CENTS,BOOK_WEIGHT_GRAMS,BOOK_LENGTH_CM,BOOK_WIDTH_CM,BOOK_HEIGHT_CM,BOOK_MAX_QUANTITY,PICKUP_ENABLED,PICKUP_ADDRESS,MELHOR_ENVIO_SERVICES,MELHOR_ENVIO_ENV,SITE_URL,PAYMENT_WEBHOOK_URL"

# Não expõe código-fonte e arquivos de desenvolvimento como páginas públicas
[[redirects]]
  from = "/functions/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/scripts/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/tests/*"
  to = "/404.html"
  status = 404
  force = true
